name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install platformio
      # Compila com os defaults (sem user_config.h) — é o que quem clona o repo vê
      - run: pio run
      # Variante com os ramos #if desligados por default (debug de touch, telas off)
      - run: pio run
        env:
          PLATFORMIO_BUILD_FLAGS: -DTOUCH_DEBUG=1 -DENABLE_SCREEN_CLOCK=0 -DENABLE_SCREEN_YOUTUBE=0

  # Testes do agente nos 3 sistemas (o agente roda em todos) e no Python mais
  # antigo suportado. Sem rede externa: as APIs são simuladas nos testes.
  agent-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r agent/requirements.txt pytest
      - run: python -m pytest agent/tests -q

  # O agente empacotado com PyInstaller continua de pé (o que a release anexa)
  agent-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r agent/requirements.txt "pyinstaller>=6,<7"
      - run: python -m PyInstaller --onefile --name cyd-pc-agent --hidden-import winrt.windows.foundation.collections agent/pc_stats_agent.py
      - run: powershell -ExecutionPolicy Bypass -File tools/exe_smoke_test.ps1 -Exe dist/cyd-pc-agent.exe

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r agent/requirements.txt pyflakes pyserial
      - run: python -m pyflakes agent/pc_stats_agent.py agent/notify.py agent/tests tools/screenshot.py tools/mock_lhm.py tools/demo_agent.py tools/improv_test.py
      - run: python -c "import json; json.load(open('agent/config.example.json'))"
      # Autostart Linux/macOS: lint + gera o unit do systemd e o plist do launchd
      # sem registrar nada (--dry-run), e valida o plist com o parser do Python
      - run: shellcheck agent/install_autostart.sh agent/uninstall_autostart.sh
      - run: |
          bash agent/install_autostart.sh --dry-run --os Linux --linger
          bash agent/install_autostart.sh --dry-run --os Darwin > mac.txt
          python -c "import plistlib; t=open('mac.txt').read(); plistlib.loads(t[t.index('<?xml'):t.index('</plist>')+8].encode()); print('plist ok')"
          bash agent/uninstall_autostart.sh --dry-run --os Linux
          bash agent/uninstall_autostart.sh --dry-run --os Darwin
