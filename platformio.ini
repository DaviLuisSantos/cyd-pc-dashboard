; CYD PC Dashboard — ESP32-2432S028R (Cheap Yellow Display)
; Toda a config da TFT_eSPI vem por build_flags, nada de editar User_Setup.h

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Dois slots de app de 1.9MB (OTA pela interface web) + NVS no mesmo offset de
; antes (0x9000), então trocar de huge_app pra cá não perde as configurações
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bblanchon/ArduinoJson@^7.0.4
    tzapu/WiFiManager@^2.0.17

build_flags =
    -DUSER_SETUP_LOADED=1
    ; Silencia o #warning de TOUCH_CS do TFT_eSPI — o touch é tratado pela
    ; XPT2046_Touchscreen no VSPI, de propósito (não definir TOUCH_CS aqui!)
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    ; --- Display: ILI9341 320x240 ---
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    ; --- Pinos do display (HSPI) ---
    ; USE_HSPI_PORT: sem isso o TFT_eSPI usa o periférico VSPI, o mesmo do touch
    ; (SPIClass(VSPI) em main.cpp) — o touchSPI.begin() redireciona o MISO do
    ; periférico pro pino do touch e as leituras do display (readRect) voltam zeradas
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    ; --- Fontes ---
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; --- SPI ---
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=6000000   ; leitura (screenshot) — a 20MHz os bits chegavam deslocados
    -DSPI_TOUCH_FREQUENCY=2500000
